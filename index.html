<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>NTC | Nexyond Training Club</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0A0C10;
            color: #F0F3F8;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1E2A32; }
        ::-webkit-scrollbar-thumb { background: #0ABAB5; border-radius: 10px; }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0A0C10;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        .loading-logo {
            text-align: center;
            animation: pulse 1.2s infinite;
        }
        .loading-logo img {
            width: 80px;
            filter: drop-shadow(0 0 12px #0ABAB5);
        }
        .loading-logo h2 {
            color: #0ABAB5;
            margin-top: 16px;
            font-weight: 700;
        }
        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        .app {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        /* HEADER */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(10, 12, 16, 0.85);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(10,186,181,0.25);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-img {
            height: 44px;
            filter: drop-shadow(0 0 6px rgba(10,186,181,0.5));
        }
        .logo-text h2 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0ABAB5, #0A6E7A);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo-text a {
    color: #8EA3B5;
    text-decoration: none;
    transition: color 0.2s;
}
.logo-text a:hover {
    color: #0ABAB5;
    text-decoration: underline;
}
        .nav-links {
            display: flex;
            gap: 24px;
        }
        .nav-link {
            font-weight: 600;
            cursor: pointer;
            padding: 8px 0;
            transition: 0.2s;

        }
        .nav-link.active, .nav-link:hover {

        }
        /* Filter button left */
        .filter-btn-left {

        }

            background-clip: text;

        /* Search & sort */
        .action-bar {
            display: flex;

            gap: 20px;
            margin-bottom: 30px;

        }
        .search-wrapper {

        }

<div class="app">
    <div class="navbar">
        <div class="logo-area">
            <img src="data/logo.png" alt="NTC" class="logo-img" onerror="this.src='https://placehold.co/44x44/0ABAB5/FFF?text=NTC'">
            <div class="logo-text">
                <h2>NexTrainClub</h2>
                <p><a href="https://nexyond.vercel.app" target="_blank" class="footer-link">by Nexyond Digital Solutions</a></p>
            </div>

    <span class="cart-count" id="cartCount">0</span>
</div>

<!-- Cart Modal (Queue) -->

    <div class="cart-modal-header">
        <h3>Workout Queue</h3>
        <i class="fas fa-times" id="closeCartModal" style="cursor:pointer; font-size:1.4rem;"></i>
    </div>
    <div id="queueList"></div>
    <input type="text" id="programNameInput" placeholder="Program name" style="background:#1A222A; border:1px solid #2A3A44; padding:12px; border-radius:40px; margin:12px 0; color:white;">
    <button class="save-program-btn" id="saveProgramBtn">Save as Program</button>

<!-- Backdrop for modals -->
<div class="backdrop" id="backdrop"></div>

<script>
    const JSON_URL = 'data/exercises.json';
    const IMAGE_BASE = 'exercises/';
    let allExercises = [];
    // Filters
    let currentMuscle = 'all';
    let currentEquipment = 'all';
    let currentLevel = 'all';
    let searchTerm = '';
    let sortType = 'name-asc';
    // Workout queue (temporary before saving)
    let queue = []; // array of exercise objects
    // Saved programs
    let savedPrograms = []; // each { id, name, exercises: [ {id, name, image, target} ] }

    // Helper functions
    function capitalize(str) { if(!str) return ''; return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase(); }
    function normalizeEquipment(equip) { if(!equip) return 'Body only'; if(equip.toLowerCase() === 'body only') return 'Body only'; return equip.split(' ').map(capitalize).join(' '); }
    function getFlameIcons(level) {
        let active = level === 'beginner' ? 1 : (level === 'intermediate' ? 2 : (level === 'expert' ? 3 : 0));
        let html = '';
        for(let i=1;i<=3;i++) html += `<i class="fas fa-fire ${i <= active ? '' : 'inactive-flame'}"></i>`;
        return html;
    }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    // Load saved programs from localStorage
    function loadSavedPrograms() {
        const stored = localStorage.getItem('ntc_programs');
        if(stored) { try { savedPrograms = JSON.parse(stored); } catch(e){} }
        else savedPrograms = [];
    }
    function saveProgramsToLocal() {
        localStorage.setItem('ntc_programs', JSON.stringify(savedPrograms));
    }
    // Update cart count badge
    function updateCartBadge() { document.getElementById('cartCount').innerText = queue.length; }

    // Add to queue
    function addToQueue(ex) {
        if(queue.find(q => q.id === ex.id)) return;
        queue.push({ id: ex.id, name: ex.name, image: ex.images?.[0] || null, target: ex.primaryMuscles?.[0] || 'General' });
        updateCartBadge();
        renderQueueModal();
        showToast(`${ex.name} added to queue`);
    }
    function removeFromQueue(idx) { queue.splice(idx,1); updateCartBadge(); renderQueueModal(); }
    function moveQueueItem(from, to) { if(to<0 || to>=queue.length) return; const item = queue.splice(from,1)[0]; queue.splice(to,0,item); renderQueueModal(); }
    function renderQueueModal() {
        const container = document.getElementById('queueList');
        if(!container) return;
        if(queue.length === 0) { container.innerHTML = '<div style="color:#8EA3B5; text-align:center;">No exercises added yet. Tap + on cards.</div>'; return; }
        container.innerHTML = queue.map((ex, idx) => `
            <div class="queue-item" draggable="true" data-idx="${idx}">
                <div style="display:flex; align-items:center; gap:8px;">
                    <i class="fas fa-grip-vertical drag-handle" style="cursor:grab;"></i>
                    <span>${escapeHtml(ex.name)}</span>
                </div>
                <i class="fas fa-trash-alt" style="color:#FF6A5C; cursor:pointer;" data-remove="${idx}"></i>
            </div>
        `).join('');
        // attach remove events
        document.querySelectorAll('[data-remove]').forEach(el => {
            el.addEventListener('click', (e) => { const idx = parseInt(el.getAttribute('data-remove')); removeFromQueue(idx); });
        });
        // drag and drop reorder
        let dragSrc = null;
        const items = document.querySelectorAll('.queue-item');
        items.forEach(item => {
            item.setAttribute('draggable', 'true');
            item.addEventListener('dragstart', (e) => { dragSrc = parseInt(item.getAttribute('data-idx')); e.dataTransfer.effectAllowed = 'move'; });
            item.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
            item.addEventListener('drop', (e) => { e.preventDefault(); const targetIdx = parseInt(item.getAttribute('data-idx')); if(dragSrc !== null && dragSrc !== targetIdx) moveQueueItem(dragSrc, targetIdx); });
        });
    }

    function saveCurrentQueueAsProgram() {
        const nameInput = document.getElementById('programNameInput');
        let programName = nameInput.value.trim();
        if(!programName) { showToast('Please enter program name'); return; }
        if(queue.length === 0) { showToast('Queue is empty'); return; }
        const newProgram = {
            id: Date.now().toString(),
            name: programName,
            exercises: [...queue]
        };
        savedPrograms.push(newProgram);
        saveProgramsToLocal();
        queue = [];
        updateCartBadge();
        renderQueueModal();
        document.getElementById('cartModal').classList.remove('open');
        document.getElementById('backdrop').classList.remove('show');
        nameInput.value = '';
        showToast(`Program "${programName}" saved!`);
        if(document.querySelector('.nav-link[data-page="myntc"].active')) renderMyNTC();
    }

    function renderMyNTC() {
        const container = document.getElementById('mainContent');
        if(!container) return;
        if(savedPrograms.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:60px;"><i class="fas fa-dumbbell" style="font-size:3rem; color:#0ABAB5;"></i><p style="margin-top:20px;">No programs yet. Create your first workout from Home page.</p></div>`;
            return;
        }
        let html = `<div class="programs-list">`;
        savedPrograms.forEach(prog => {
            // İlk egzersizin ilk resmini bul
            let firstImage = '';
            if(prog.exercises && prog.exercises.length > 0 && prog.exercises[0].image) {
                firstImage = `${IMAGE_BASE}${prog.exercises[0].image}`;
            } else {
                firstImage = 'https://placehold.co/800x450/1E2A32/0ABAB5?text=NTC';
            }
            html += `
                <div class="program-large-card" data-prog-id="${prog.id}">
                    <img class="program-card-img" src="${firstImage}" onerror="...">
                    <div class="program-card-info">
                        <div class="program-card-title">${escapeHtml(prog.name)}</div>
                        <div class="program-card-count"><i class="fas fa-list-ol"></i> ${prog.exercises.length} exercises</div>
                        <div class="program-actions">
                            <button class="edit-btn" data-id="${prog.id}"><i class="fas fa-pen"></i> Edit</button>
                            <button class="delete-btn" data-id="${prog.id}"><i class="fas fa-trash"></i> Delete</button>
                        </div>
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        container.innerHTML = html;
        document.querySelectorAll('.program-large-card').forEach(card => {
            card.addEventListener('click', () => {
                const id = card.getAttribute('data-prog-id');
                const program = savedPrograms.find(p => p.id === id);
                if(program) showProgramDetailView(program);
            });
        });
        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-id');
                const program = savedPrograms.find(p => p.id === id);
                if(program) editProgram(program);
            });
        });
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-id');
                if(confirm('Delete this program?')) {
                    savedPrograms = savedPrograms.filter(p => p.id !== id);
                    saveProgramsToLocal();
                    renderMyNTC();
                    showToast('Program deleted');
                }
            });
        });
    }

    function editProgram(program) {
    const container = document.getElementById('mainContent');
    let searchTermEdit = '';
    let searchResults = [];
    
    const renderEditView = () => {
        let exercisesListHtml = '';
        program.exercises.forEach((ex, idx) => {
            let imgUrl = ex.image ? `${IMAGE_BASE}${ex.image}` : '';
            exercisesListHtml += `
                <div class="edit-exercise-item">
                    <div class="edit-exercise-name" data-ex-idx="${idx}">${escapeHtml(ex.name)}</div>
                    <button class="remove-exercise-btn" data-remove-idx="${idx}"><i class="fas fa-trash-alt"></i></button>
                </div>
            `;
        });
        
        let searchResultsHtml = '';
        if(searchTermEdit.trim()) {
            const filtered = allExercises.filter(ex => 
                ex.name.toLowerCase().includes(searchTermEdit.toLowerCase()) &&
                !program.exercises.some(pe => pe.id === ex.id)
            ).slice(0, 10);
            if(filtered.length) {
                searchResultsHtml = `<div class="search-results-list">`;
                filtered.forEach(ex => {
                    searchResultsHtml += `
                        <div class="search-result-item" data-add-id="${ex.id}">
                            <span>${escapeHtml(ex.name)}</span>
                            <button class="add-exercise-btn">Add</button>
                        </div>
                    `;
                });
                searchResultsHtml += `</div>`;
            } else {
                searchResultsHtml = `<div style="color:#8EA3B5; text-align:center;">No exercises found</div>`;
            }
        }
        
        const html = `
            <div class="edit-program-view">
                <button class="back-button" id="backFromEditBtn"><i class="fas fa-arrow-left"></i> Back to My Programs</button>
                <h2>Edit Program</h2>
                <input type="text" id="editProgramName" class="edit-program-name" value="${escapeHtml(program.name)}" placeholder="Program name">
                <div class="exercise-add-section">
                    <h3>Add Exercises</h3>
                    <div class="search-add-wrapper">
                        <input type="text" id="editSearchInput" placeholder="Search exercises..." value="${escapeHtml(searchTermEdit)}">
                        <button id="editSearchBtn">Search</button>
                    </div>
                    <div id="editSearchResults">${searchResultsHtml}</div>
                </div>
                <h3>Exercises in this program</h3>
                <div class="edit-exercise-list" id="editExercisesList">${exercisesListHtml}</div>
                <button id="saveProgramChangesBtn" style="background:#0ABAB5; border:none; padding:14px; border-radius:40px; width:100%; margin-top:24px; font-weight:bold;">Save Changes</button>
            </div>
        `;
        container.innerHTML = html;
        
        // Event listeners for edit view
        document.getElementById('backFromEditBtn').addEventListener('click', () => renderMyNTC());
        document.getElementById('editProgramName').addEventListener('change', (e) => { program.name = e.target.value; });
        const searchInput = document.getElementById('editSearchInput');
        const searchBtn = document.getElementById('editSearchBtn');
        const updateSearch = () => {
            searchTermEdit = searchInput.value;
            renderEditView();
        };
        searchBtn.addEventListener('click', updateSearch);
        searchInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') updateSearch(); });
        
        // Add exercise from search results
        document.querySelectorAll('.search-result-item').forEach(item => {
            item.addEventListener('click', (e) => {
                if(e.target.classList.contains('add-exercise-btn')) {
                    const id = item.getAttribute('data-add-id');
                    const exercise = allExercises.find(ex => ex.id === id);
                    if(exercise && !program.exercises.find(pe => pe.id === exercise.id)) {
                        program.exercises.push({
                            id: exercise.id,
                            name: exercise.name,
                            image: exercise.images?.[0] || null,
                            target: exercise.primaryMuscles?.[0] || 'General'
                        });
                        saveProgramsToLocal();
                        renderEditView();
                        showToast(`${exercise.name} added`);
                    }
                }
            });
        });
        
        // Remove exercise from program
        document.querySelectorAll('.remove-exercise-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(btn.getAttribute('data-remove-idx'));
                program.exercises.splice(idx, 1);
                saveProgramsToLocal();
                renderEditView();
                showToast('Exercise removed');
            });
        });
        
        // Click on exercise name to open detail modal
        document.querySelectorAll('.edit-exercise-name').forEach(nameEl => {
            nameEl.addEventListener('click', (e) => {
                const idx = parseInt(nameEl.getAttribute('data-ex-idx'));
                const ex = program.exercises[idx];
                // Find full exercise data from allExercises
                const fullEx = allExercises.find(e => e.id === ex.id);
                if(fullEx) simpleDetailModal(fullEx);
                else {
                    // Fallback
                    const fakeEx = { ...ex, primaryMuscles: [ex.target], secondaryMuscles: [], equipment: 'Body only', level: 'beginner', instructions: [] };
                    simpleDetailModal(fakeEx);
                }
            });
        });
        
        document.getElementById('saveProgramChangesBtn').addEventListener('click', () => {
            saveProgramsToLocal();
            showToast('Program saved');
            renderMyNTC();
        });
    };
    renderEditView();
}

                        instructions: [],

                    };
                    simpleDetailModal(fakeEx);
                }
            }
        });
    });
}

    // Filter and render exercises (Home page)
    function filterAndSort() {
        let filtered = [...allExercises];
        if(currentMuscle !== 'all') filtered = filtered.filter(ex => ex.primaryMuscles && ex.primaryMuscles.map(m=>m.toLowerCase()).includes(currentMuscle.toLowerCase()));
        if(currentEquipment !== 'all') filtered = filtered.filter(ex => (ex.equipment || 'body only').toLowerCase() === currentEquipment.toLowerCase());
        if(currentLevel !== 'all') filtered = filtered.filter(ex => ex.level === currentLevel);
        if(searchTerm.trim()) {
            const term = searchTerm.toLowerCase();
            filtered = filtered.filter(ex => ex.name.toLowerCase().includes(term) || (ex.primaryMuscles && ex.primaryMuscles.some(m=>m.toLowerCase().includes(term))) || (ex.equipment && ex.equipment.toLowerCase().includes(term)));
        }
        if(sortType === 'name-asc') filtered.sort((a,b)=>a.name.localeCompare(b.name));
        else filtered.sort((a,b)=>b.name.localeCompare(a.name));
        return filtered;
    }
    function renderHome() {
        const container = document.getElementById('mainContent');
        const list = filterAndSort();
        if(!list.length) { container.innerHTML = `<div class="loading-placeholder">No exercises found. Adjust filters.</div>`; return; }
        let html = `
            <div class="hero"><h1>engineered to move</h1><p>1,300+ exercises • manual sliders • build your workout</p></div>
            <div class="action-bar">
                <div class="search-wrapper"><i class="fas fa-search"></i><input type="text" id="searchInputHome" class="search-input" placeholder="Search exercise..."></div>
                <select id="sortSelectHome" class="sort-select"><option value="name-asc">A → Z</option><option value="name-desc">Z → A</option></select>
            </div>
            <div class="exercises-grid" id="homeGrid"></div>
        `;
        container.innerHTML = html;
        const grid = document.getElementById('homeGrid');
        grid.innerHTML = list.map((ex, idx) => {
            const images = ex.images || [];
            const sliderId = `slider_${ex.id}_${idx}`;
            const primaryMuscle = ex.primaryMuscles && ex.primaryMuscles.length ? capitalize(ex.primaryMuscles[0]) : 'General';
            const equipment = normalizeEquipment(ex.equipment);
            const level = ex.level || 'beginner';
            return `
                <div class="exercise-card" data-id="${ex.id}">
                    <div class="slider-container" id="${sliderId}">
                        <div class="slider-images">
                            ${images.length ? images.map(img => `<img class="slider-img" src="${IMAGE_BASE}${img}" onerror="this.src='https://placehold.co/400x400/1E2A32/0ABAB5?text=NTC'">`).join('') : `<img class="slider-img" src="https://placehold.co/400x400/1E2A32/0ABAB5?text=No+Image">`}
                        </div>
                        ${images.length > 1 ? `<button class="slider-btn slider-prev"><i class="fas fa-chevron-left"></i></button><button class="slider-btn slider-next"><i class="fas fa-chevron-right"></i></button>` : ''}
                    </div>
                    <div class="card-info">
                        <div class="exercise-name">${escapeHtml(ex.name)}</div>
                        <div class="meta-grid">
                            <div class="meta-item"><i class="fas fa-bullseye"></i> ${escapeHtml(primaryMuscle)}</div>
                            <div class="meta-item"><i class="fas fa-tools"></i> ${escapeHtml(equipment)}</div>
                            <div class="meta-item"><i class="fas fa-chart-simple"></i> <span class="flame-level">${getFlameIcons(level)}</span></div>
                        </div>
                        <button class="add-queue-btn" data-id="${ex.id}"><i class="fas fa-cart-plus"></i> Add to Queue</button>
                    </div>
                </div>
            `;
        }).join('');
        // init sliders (manual only, no auto)
        list.forEach((ex, idx) => {
            const images = ex.images || [];
            if(images.length > 1) {
                const sliderId = `slider_${ex.id}_${idx}`;
                const container = document.getElementById(sliderId);
                if(container) {
                    let current = 0;
                    const sliderDiv = container.querySelector('.slider-images');
                    const prevBtn = container.querySelector('.slider-prev');
                    const nextBtn = container.querySelector('.slider-next');
                    const update = () => { if(sliderDiv) sliderDiv.style.transform = `translateX(-${current * 100}%)`; };
                    prevBtn?.addEventListener('click', (e) => { e.stopPropagation(); current = (current - 1 + images.length) % images.length; update(); });
                    nextBtn?.addEventListener('click', (e) => { e.stopPropagation(); current = (current + 1) % images.length; update(); });
                }
            }
        });
        // add to queue buttons
        document.querySelectorAll('.add-queue-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-id');
                const exercise = allExercises.find(ex => ex.id === id);
                if(exercise) addToQueue(exercise);
            });
        });
        // card click open modal (simple detail)
        document.querySelectorAll('.exercise-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if(e.target.closest('.add-queue-btn') || e.target.closest('.slider-btn')) return;
                const id = card.getAttribute('data-id');
                const ex = allExercises.find(e => e.id === id);
                if(ex) simpleDetailModal(ex);
            });
        });
        // attach search and sort
        document.getElementById('searchInputHome')?.addEventListener('input', (e) => { searchTerm = e.target.value; renderHome(); });
        document.getElementById('sortSelectHome')?.addEventListener('change', (e) => { sortType = e.target.value; renderHome(); });
    }
    function simpleDetailModal(ex) {
    const backdrop = document.getElementById('backdrop');
    const modalDiv = document.createElement('div');
    modalDiv.className = 'program-detail-modal';
    const images = ex.images || [];
    let sliderHtml = `<div class="slider-container" style="margin-bottom:16px;"><div class="slider-images" style="display:flex;">`;
    images.forEach(img => { sliderHtml += `<img class="slider-img" style="width:100%; flex-shrink:0;" src="${IMAGE_BASE}${img}">`; });
    sliderHtml += `</div>${images.length>1 ? `<button class="slider-btn slider-prev"><i class="fas fa-chevron-left"></i></button><button class="slider-btn slider-next"><i class="fas fa-chevron-right"></i></button>` : ''}</div>`;
    modalDiv.innerHTML = `

        <div class="meta-grid" style="margin:16px 0;">
            <div class="meta-item">Target: ${escapeHtml(ex.primaryMuscles?.map(capitalize).join(', ') || '-')}</div>

            <div class="meta-item">Level: ${getFlameIcons(ex.level || 'beginner')}</div>
        </div>
        <div><strong>Instructions</strong><br>${(ex.instructions || ['No detailed steps']).map(step => `• ${escapeHtml(step)}`).join('<br>')}</div>
        <button class="add-queue-btn" data-id="${ex.id}" style="margin-top:20px;">Add to Queue</button>
    `;
    document.body.appendChild(modalDiv);
    backdrop.classList.add('show');
    
    // Dışarı tıklayınca kapat
    const closeModal = () => {
        modalDiv.remove();
        backdrop.classList.remove('show');
        backdrop.removeEventListener('click', closeModal);
    };
    backdrop.addEventListener('click', closeModal);
    
    if(images.length > 1) {
        let current = 0;
        const sliderDiv = modalDiv.querySelector('.slider-images');
        const prev = modalDiv.querySelector('.slider-prev');
        const next = modalDiv.querySelector('.slider-next');
        const update = () => { if(sliderDiv) sliderDiv.style.transform = `translateX(-${current*100}%)`; };
        prev?.addEventListener('click', (e) => { e.stopPropagation(); current = (current-1+images.length)%images.length; update(); });
        next?.addEventListener('click', (e) => { e.stopPropagation(); current = (current+1)%images.length; update(); });
    }
    modalDiv.querySelector('#closeSimpleModal')?.addEventListener('click', closeModal);
    modalDiv.querySelector('.add-queue-btn')?.addEventListener('click', (e) => { addToQueue(ex); modalDiv.remove(); backdrop.classList.remove('show'); backdrop.removeEventListener('click', closeModal); });
}

    // Filter chips and sidebar
    function buildFilterChips() {
        const muscles = [...new Set(allExercises.flatMap(ex => ex.primaryMuscles || []).map(m=>m.toLowerCase()))].sort();
        const equipments = [...new Set(allExercises.map(ex => (ex.equipment || 'body only').toLowerCase()))].sort();
        const levels = ['beginner','intermediate','expert'];
        const muscleDiv = document.getElementById('muscleChips');
        if(muscleDiv) {
            muscleDiv.innerHTML = `<div class="filter-chip ${currentMuscle === 'all' ? 'active' : ''}" data-filter="muscle" data-value="all">All Muscles</div>` + muscles.map(m => `<div class="filter-chip ${currentMuscle === m ? 'active' : ''}" data-filter="muscle" data-value="${m}">${capitalize(m)}</div>`).join('');
        }
        const equipDiv = document.getElementById('equipmentChips');
        if(equipDiv) {
            equipDiv.innerHTML = `<div class="filter-chip ${currentEquipment === 'all' ? 'active' : ''}" data-filter="equipment" data-value="all">All</div>` + equipments.map(e => `<div class="filter-chip ${currentEquipment === e ? 'active' : ''}" data-filter="equipment" data-value="${e}">${capitalize(e)}</div>`).join('');
        }
        const levelDiv = document.getElementById('levelChips');
        if(levelDiv) {
            levelDiv.innerHTML = `<div class="filter-chip ${currentLevel === 'all' ? 'active' : ''}" data-filter="level" data-value="all">All</div>` + levels.map(l => `<div class="filter-chip ${currentLevel === l ? 'active' : ''}" data-filter="level" data-value="${l}">${capitalize(l)}</div>`).join('');
        }
        document.querySelectorAll('.filter-chip[data-filter]').forEach(chip => {
            chip.addEventListener('click', () => {
                const type = chip.getAttribute('data-filter');
                const val = chip.getAttribute('data-value');
                if(type === 'muscle') currentMuscle = val;
                if(type === 'equipment') currentEquipment = val;
                if(type === 'level') currentLevel = val;
                buildFilterChips();
                if(document.querySelector('.nav-link[data-page="home"].active')) renderHome();
            });
        });
    }
    function resetFilters() { currentMuscle='all'; currentEquipment='all'; currentLevel='all'; searchTerm=''; if(document.getElementById('searchInputHome')) document.getElementById('searchInputHome').value=''; buildFilterChips(); if(document.querySelector('.nav-link[data-page="home"].active')) renderHome(); }

    // Navigation
    function initNavigation() {
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                const page = link.getAttribute('data-page');
                if(page === 'home') renderHome();
                else if(page === 'myntc') renderMyNTC();
            });
        });
    }
    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    // Load data and init
async function loadData() {
    try {
        const res = await fetch(JSON_URL);
        if(!res.ok) throw new Error('Network error');
        allExercises = await res.json();
        loadSavedPrograms();
        buildFilterChips();
        renderHome();
        initNavigation();
        // sidebar logic
        const filterBtn = document.getElementById('filterBtnLeft');
        const sidebar = document.getElementById('filtersSidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const closeSide = document.getElementById('closeSidebar');
        function openSide() { sidebar.classList.add('open'); overlay.classList.add('open'); }
        function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
        filterBtn.addEventListener('click', openSide);
        closeSide.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);
        document.getElementById('resetFiltersBtn').addEventListener('click', resetFilters);
        
        // cart modal - DÜZELTİLMİŞ VERSİYON (arka plan siyah değil, tıklama engeli yok)
        const cartBtn = document.getElementById('cartBtn');
        const cartModal = document.getElementById('cartModal');
        const closeCart = document.getElementById('closeCartModal');
        
        // AÇILIŞ: sadece modal'ı göster, arka plan overlay KALDIR
        cartBtn.addEventListener('click', () => { 
            cartModal.classList.add('open'); 
            renderQueueModal(); 
        });
        
        // ÇARP ILE KAPAT
        closeCart.addEventListener('click', () => { 
            cartModal.classList.remove('open'); 
        });
        
        // DIŞARI TIKLAYINCA KAPAT (arka plan olmadan)
        window.addEventListener('click', (e) => {
            if (cartModal.classList.contains('open') && 
                !cartModal.contains(e.target) && 
                e.target !== cartBtn && 
                !cartBtn.contains(e.target)) {
                cartModal.classList.remove('open');
            }
        });
        
        // ESC TUŞU İLE KAPAT
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && cartModal.classList.contains('open')) {
                cartModal.classList.remove('open');
            }
        });
        
        document.getElementById('saveProgramBtn').addEventListener('click', saveCurrentQueueAsProgram);
        
        // hide loading
        setTimeout(() => { document.getElementById('loadingOverlay').style.opacity = '0'; setTimeout(() => document.getElementById('loadingOverlay').style.display = 'none', 500); }, 800);
    } catch(err) {
        document.getElementById('mainContent').innerHTML = `<div class="loading-placeholder">Error loading data: ${err.message}</div>`;
        document.getElementById('loadingOverlay').style.display = 'none';
    }
}

    // Create sidebar html dynamically
    document.body.insertAdjacentHTML('beforeend', `
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <div class="filters-sidebar" id="filtersSidebar">
            <div class="sidebar-header" style="display:flex; justify-content:space-between; margin-bottom:24px;">
                <h3>Filters</h3><button id="closeSidebar" style="background:none; border:none; color:white; font-size:24px;"><i class="fas fa-times"></i></button>
            </div>
            <div class="filter-group"><div class="filter-label"><i class="fas fa-bullseye"></i> Muscle group</div><div class="filter-chips" id="muscleChips"></div></div>
            <div class="filter-group"><div class="filter-label"><i class="fas fa-tools"></i> Equipment</div><div class="filter-chips" id="equipmentChips"></div></div>
            <div class="filter-group"><div class="filter-label"><i class="fas fa-chart-line"></i> Level</div><div class="filter-chips" id="levelChips"></div></div>
            <button class="reset-filters" id="resetFiltersBtn">Reset all filters</button>
        </div>
    `);
    loadData();
</script>
</body>
</html>
